<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synergon</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/viewer.css">
</head>
<body>
<div id="app" hidden></div>
<div id="viewer-shell">
  <aside id="parts" class="ui" aria-label="Workspace panel">
    <div id="workspace-top"></div>
    <div id="scene-recovery" hidden></div>
    <footer id="toolbar" aria-label="Workspace tools">
      <button id="copy-link" class="icon-button" type="button" aria-label="Copy view link" title="Copy view link"></button>
      <button id="save-picture" class="icon-button" type="button" aria-label="Save picture" title="Save picture"></button>
      <button id="more-btn" class="icon-button" type="button" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="more"></button>
    </footer>
  </aside>
  <button id="rail-resize" class="ui icon-button" type="button" role="separator" aria-orientation="vertical" aria-controls="parts" aria-label="Workspace panel width" title="Drag to resize. Click to collapse."></button>
  <button id="open-parts" class="ui icon-button" type="button" aria-label="Open workspace panel" title="Open workspace panel" aria-expanded="false" aria-controls="parts"></button>
  <div id="scrim" class="ui" hidden></div>
  <section id="more" class="ui pop" aria-label="Settings" hidden></section>

  <div id="stage">
    <div id="frame">
      <img id="photo" alt="" hidden>
      <canvas id="gl" tabindex="0" aria-label="3D view of the rig"></canvas>
      <canvas id="overlay" hidden></canvas>
      <svg id="hud" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="legend" hidden></div>
      <div id="caption" hidden></div>
    </div>
    <div id="tip" class="ui" hidden></div>
    <div id="status">Loading…</div>
    <div id="notices" class="ui" aria-live="polite"></div>
    <div id="empty" class="ui" hidden>All components are hidden. <button id="empty-show" type="button">Show all components</button></div>
    <div id="key" class="ui" hidden></div>
    <div id="view-controls" class="ui" role="group" aria-label="View controls">
      <button id="view-menu" class="icon-button" type="button" aria-label="Views" title="Views" aria-expanded="false" aria-controls="views"></button>
      <div id="views" class="views" aria-label="Look from"></div>
      <button id="operator-view" class="icon-button" type="button" aria-label="Operator’s eye" title="Operator’s eye"></button>
      <button id="reset" class="icon-button" type="button" aria-label="Reset all" title="Reset all rig adjustments, visibility and the camera"></button>
    </div>
    <div id="toast" class="ui" hidden role="status"></div>
  </div>

  <aside id="inspector" class="ui" aria-label="Component inspector">
    <details id="components">
      <summary id="components-toggle"><span>Components</span></summary>
      <div id="tree"></div>
    </details>
    <div id="inspection"><aside id="card" class="ui" hidden aria-label="Selected part"></aside></div>
  </aside>

  <div id="live-more" hidden>
    <p class="live-code">Browser code <b id="live-code"></b><span>Give this code to an agent to send views to this browser.</span></p>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
