<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Synergon is a work environment layout, design and evaluation tool. Arrange assets in rooms and measure their spatial relationships.">
  <link rel="help" type="text/plain" href="/llms.txt" title="Agent guide">
  <link rel="service-desc" type="application/json" href="/api/commands" title="Command catalogue">
  <link rel="icon" href="data:,">
  <title>Synergon · Room layout</title>
  <style>
    .room-home{margin:0;background:#f3f4f0;color:#243338;font:16px/1.5 system-ui,sans-serif;min-height:100svh}
    .home-bar{border-bottom:1px solid #dde3d9;background:#f8f9f5}.home-bar>div{width:min(92%,1180px);margin:0 auto;height:52px;display:flex;align-items:center;justify-content:space-between}
    .home-bar>div>a{text-decoration:none;font-weight:500;flex:none}.home-bar>div>a:hover{text-decoration:underline}
    .room-home main{width:min(92%,1180px);margin:0 auto;padding:3rem 0 4rem;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:3rem;align-items:center}
    .room-home h1{font:600 clamp(3rem,7vw,5.5rem)/1 system-ui,sans-serif;letter-spacing:-.07em;margin:0 0 1.3rem}
    .room-home p{max-width:40ch;font-size:1.15rem;margin:0}
    .room-home main nav{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.3rem;margin-top:2rem}.room-home a{color:#22534e}
    .room-home main nav>a:first-child{background:#23534d;color:#fff;padding:.7rem 1.1rem;border-radius:.4rem;text-decoration:none}
    .room-home main nav>a[aria-busy]{background:#4d6f68;cursor:progress}
    .room-home .hy-home{display:flex;align-items:center;gap:.15rem;min-width:0;flex:1;margin-left:-.5rem}
    .room-home .hy-menu{position:relative;min-width:0;flex:0 1 auto}
    .room-home .hy-trigger{display:flex;align-items:center;gap:.3rem;cursor:pointer;list-style:none;padding:.35rem .5rem;border-radius:6px;font-weight:500;color:#22534e;white-space:nowrap}
    .room-home .hy-trigger::-webkit-details-marker{display:none}.room-home .hy-trigger:hover,.room-home .hy-menu[open]>.hy-trigger{background:#e8eee8}
    .room-home .hy-label{min-width:0;max-width:16rem;overflow:hidden;text-overflow:ellipsis}
    .room-home .hy .rm-icon{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .room-home .hy-trigger .rm-icon{color:#68756b}.room-home .hy-sep{color:#9aa69c;flex:none}
    .room-home .hy-list{position:absolute;z-index:5;top:calc(100% + 6px);left:0;min-width:260px;max-width:min(360px,calc(100vw - 32px));max-height:60vh;overflow:auto;padding:6px;background:#fbfcf8;border:1px solid #cdd5ca;border-radius:8px;box-shadow:0 8px 24px #243a2f26}
    .room-home .hy-item{box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:6px 8px;border:0;border-radius:5px;background:transparent;font:inherit;font-size:.95rem;text-align:left;color:#243338;text-decoration:none;cursor:pointer}
    .room-home .hy-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .room-home .hy-item:hover,.room-home .hy-item:focus-visible{background:#e8eee8;outline:none}.room-home .hy-item[aria-current]{font-weight:600;color:#214f40}
    .room-home .hy-item[aria-current] .rm-icon{color:#2f6a5f}.room-home .hy .hy-action{color:#22534e}.room-home .hy-action .rm-icon{color:#2f6a5f}
    .room-home .hy-play{flex:none;display:inline-flex;align-items:center;gap:.3rem;height:30px;margin-left:.5rem;padding:0 .8rem 0 .6rem;border:0;border-radius:15px;background:#23534d;color:#fff;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
    .room-home .hy-play svg{width:14px;height:14px;fill:currentColor}.room-home .hy-play:hover{background:#173f3a}.room-home .hy-play[hidden]{display:none}
    .room-home .hy-play:focus-visible{outline:2px solid #2f6a5f;outline-offset:2px}
    .room-home .home-error{margin-top:1rem;font-size:.95rem;color:#864330}
    .room-home .hy-divider{border-top:1px solid #dde3d9;margin:5px 2px}.room-home .hy-note{font-size:.9rem;color:#68756b;padding:6px 8px;margin:0;max-width:none}
    .room-home .dlg{width:min(380px,calc(100vw - 28px));padding:24px;border:1px solid #c8d1c3;border-radius:10px;background:#fbfcf8;color:#243338;box-shadow:0 8px 40px #20332c33}
    .room-home .dlg::backdrop{background:#1a322747}.room-home .dlg h2{margin:0 0 18px;font-size:20px;font-weight:600;letter-spacing:-.02em}
    .room-home .dlg-field{display:grid;gap:5px;font-size:.9rem;color:#4d5b52}
    .room-home .dlg input{font:inherit;font-size:1rem;color:#243338;min-height:38px;padding:6px 10px;border:1px solid #c5d0c4;border-radius:5px;background:#fff}
    .room-home .dlg-acts{margin-top:20px;display:flex;gap:8px;justify-content:flex-end}.room-home .dlg-err{color:#864330;margin:8px 0;font-size:.95rem}
    .room-home .dlg-acts button{font:inherit;min-height:38px;padding:6px 14px;background:#fff;border:1px solid #cbd4c9;border-radius:5px;color:#243338;cursor:pointer}
    .room-home .dlg-acts .primary{background:#23534d;border-color:#23534d;color:#fff}
    .home-story{position:relative;border:1px solid #d3dacf;border-radius:14px;background:#fff;box-shadow:0 10px 30px #243a2f1c;overflow:hidden}
    .home-viewport{display:grid}.home-slide{grid-area:1/1;margin:0;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
    .home-slide.on{opacity:1;visibility:visible;transition:opacity .35s ease}.home-slide:not(.on) figcaption{visibility:hidden}
    .home-slide img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;background:#e9ede5}
    .home-slide figcaption{display:grid;gap:.2rem;padding:1rem 1.2rem .4rem}.home-slide strong{font-size:1.15rem}
    .home-text{color:#4d5b52}.home-text a{white-space:nowrap}
    .home-step{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2f6a5f;font-weight:600}
    .home-controls{display:flex;align-items:center;gap:6px;padding:.4rem .8rem .9rem}
    .home-control{width:36px;height:36px;border:1px solid transparent;border-radius:8px;background:transparent;color:#3c4b42;font-size:1.2rem;cursor:pointer}
    .home-control:hover{background:#eef2ec}.home-toggle{font-size:.8rem}
    .home-dots{display:flex;gap:3px;flex:1;min-width:0}
    .home-dot{position:relative;flex:1;min-width:0;height:36px;border:0;background:transparent;cursor:pointer;padding:6px 1px 0;font:11.5px system-ui,sans-serif;color:#68756b}
    .home-dot span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .home-dot::before,.home-dot::after{content:"";position:absolute;left:2px;right:2px;top:0;height:3px;border-radius:2px;background:#dbe2d8}
    .home-dot::after{background:#23534d;transform:scaleX(0);transform-origin:left}
    .home-dot[aria-current=true]{color:#214f40;font-weight:600}.home-dot[aria-current=true]::after{transform:scaleX(1)}
    .rotating .home-dot[aria-current=true]::after{animation:home-progress 6s linear forwards}
    @keyframes home-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .home-control:focus-visible,.home-dot:focus-visible,.room-home .hy-trigger:focus-visible,.room-home .dlg :focus-visible{outline:2px solid #2f6a5f;outline-offset:2px}
    .room-home .hy-item:focus-visible{box-shadow:inset 0 0 0 2px #2f6a5f}
    @media(max-width:600px){.home-bar>div{position:relative;gap:.6rem;height:auto;min-height:52px;padding:5px 0}.home-bar>div>a[href="/wiki/"]{display:none}.home-hero-wiki{display:inline!important}.room-home .hy-label{max-width:none}.room-home .hy-home{flex-wrap:wrap;row-gap:2px}.room-home .hy-home{padding-right:40px}.room-home .hy-play{position:absolute;right:0;top:50%;transform:translateY(-50%);width:30px;margin:0;padding:0;justify-content:center}.room-home .hy-play span{display:none}.room-home .hy-play svg{margin-left:2px}.room-home .hy-home{gap:0;margin-left:-.3rem;font-size:15px}
      .room-home .hy-menu{position:static}.room-home .hy-scene{flex-shrink:0}.room-home .hy-list{left:0;right:0;max-width:none;min-width:0}
      .room-home .hy-trigger{gap:.1rem;padding:.35rem .3rem}.room-home .hy .hy-trigger .rm-icon{width:12px;height:12px}.room-home .hy-sep{padding:0 .1rem}}
    @media(max-width:900px){.room-home main{grid-template-columns:1fr;gap:2rem;padding-top:2rem}.home-dot{padding:0}.home-dot span{display:none}.home-dot::before,.home-dot::after{top:16px;height:4px}}
  </style>
</head>

</html>
