# Run-time numbers of the rig binding (viewer/src/person/rig-binding.ts): how the seated person is put into the real rig.
# Owner: MV-rig. Same record shape as runtime-person.toml (value, unit, range, class, basis for "assumed", tier, evidence;
# units are not converted, the unit says how the code reads the number; validated by shared/runtime-params.ts).
#
# What is NOT here, and where it is instead:
#   - every size and position of the rig (cushion, front roll, backrest, armrest pads, grip handles, pedal faces, heel rest,
#     screens, the cushion's compression seat.eye_cushion_compression): the rig's own parameter records
#     (assets/rig-b/params/*.toml), read through the rig's description file and its D_ / S_ points;
#   - the body's own allowances against a backrest (back_clear, pelvis_press, back_press, back_behind_hip) and the knee radius
#     fallback: runtime-person.toml [operator.targets], the numbers the lab's solver was tuned with;
#   - the person's survey dimensions (eyeheightsitting, poplitealheight, buttockkneelength): the person's shape measures.
# So the binding's own numbers are few: where on a pad the palm rests, which rig pedal each foot uses, and numerical devices.

[rig_binding.seat]
pan_rear_under_back = { value = 0.05, unit = "m", range = 0.03, class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "How far the contact solid of the cushion runs behind the backrest surface, so the buttock that meets the backrest corner is still held by it. Lab operator.ts standInProps (RL round 6): the stand-in pan's rear ran 0.05 m under the backrest. The real cushion continues under the backrest bolster (seat.cushion_sections rows beyond 1.0)." }
placement_iterations = { value = 6, unit = "count", range = 4, class = "invented", tier = "cosmetic", evidence = "Passes of the hip placement between the backrest contact (along the backrest normal) and the seat height (vertical): each pass moves the hip less than a millimetre after the third on the three test persons; a device of the method." }

[rig_binding.armrest]
palm_inset = { value = 0.05, unit = "m", range = 0.03, class = "assumed", basis = "by_eye", tier = "layout", evidence = "A hand laid flat on the armrest pad: its palm centre this far behind the pad's front end, along the pad, so the fingers rest on the pad's front edge rather than in the air. Chosen by eye: a palm centre lies about 0.07 m behind the fingertips' base for the median hand (hand length 0.19 m); the pad is 0.451 m long (pods.pad_size)." }
elbow_above_pad_default = { value = 0.05, unit = "m", range = 0.015, class = "assumed", basis = "by_eye", tier = "layout", evidence = "Height of the elbow joint above the armrest pad's top for the elbow pole when the body has no fit: the forearm's radius at the elbow end. The fit's own value (motion.persons[*].arm.fore[0], 0.041 to 0.060 m on F05 to M95H) is used whenever there is one." }

[rig_binding.pedal]
order = { value = [1, 3, 2], unit = "count", range = 0, class = "assumed", basis = "convention", tier = "layout", evidence = "Which rig pedal (D_pedal_face_<n>, 1 = the operator's left, 3 = the right) is the solver's pedals[0], [1] and [2]: the left foot rests on pedal 1, the right foot on pedal 3, and the right foot's reach in the scripted sequences (operator.ts demo30 presses pedals[2]) is the centre pedal. Feet 0.28 m apart (2 x pedalset.pitch) as in a car's footwell; the lab's stand-in had the two home pedals under the hips." }
ball_on_face = { value = 0.0, unit = "m", range = 0.03, class = "assumed", basis = "by_eye", tier = "layout", evidence = "Where the sole under the ball of the foot touches the pedal: this far up the face from its centre (D_pedal_face_<n>, along its z). 0 = the middle of the pad (pods pad height 0.10 m, pedals.pad_size): the heel then finds its place on the heel plate for the person's foot length." }
search_iterations = { value = 40, unit = "count", range = 20, class = "invented", tier = "cosmetic", evidence = "Bisection steps that find the heel's place on the heel plate (0.6 m of support searched: under a micrometre); a device of the method." }

[rig_binding.findings]
clearance_samples = { value = 16, unit = "count", range = 8, class = "invented", tier = "cosmetic", evidence = "Points along each body capsule at which its clearance to a rig part is measured (a capsule is at most 0.3 m long: under 20 mm apart); a device of the method." }
roll_samples = { value = 8, unit = "count", range = 4, class = "invented", tier = "cosmetic", evidence = "Points on the cushion's front roll, crest to foremost point, in the cushion profile handed to the contact layer and to the slab-error report (the rig's own mesh uses seat.cushion_lip_steps over a larger angle); a device of the method." }
buttock_popliteal_share = { value = 0.81, unit = "ratio", range = 0.03, class = "assumed", basis = "literature", tier = "critical", evidence = "Survey cross-check of the seat depth finding only: the knee crease estimated as this share of the survey's buttock-knee length from the backrest surface (the person's measures have no buttock-popliteal length). Lab B4 round 6 depth rule (motion.persons[*].seat.depth_rule): 0.81, the buttock-popliteal / buttock-knee ratio of both sexes in ANSUR-type surveys, believed, not looked up; British adult tables quoted from memory give 0.83 to 0.85. The binding's own crease, from the solved knee joint and the thigh's radius, is the primary figure." }
