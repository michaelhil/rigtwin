# Run-time numbers of the person in the product viewer (viewer/src/person/). One record per number:
#   value, unit, range (the span in which the number is credible or was tried, same unit), class, basis (for "assumed"),
#   tier (critical: changes an ergonomic result; layout: posture or placement; cosmetic: look or motion only), evidence.
# Units are not converted: the unit says how the code reads the number. Validated by shared/runtime-params.ts in
# `bun run check` and when the viewer is bundled (tools/bundle.ts refuses an incomplete record).
# Owner: MV-core (viewer). The values were ported unchanged from the avatar lab (work/avatar-lab/viewer/src/, the
# version the visual designer passed in REVIEW-08 and REVIEW-10); the lab's file and section are named in each record.
# Classes: measured = measured on the lab's meshes or renders; assumed = chosen (basis: convention = the designer's
# shot list or pose library, literature = textbook or paper, look_dev = tuned by eye in the lab's look development,
# by_eye = set by eye for geometry); invented = a device of the method (iterations, step sizes, softness).

# ==================================================================================================================
# [operator] the seated-operator solver (operator.ts; lab operator.ts, owner B4)
# ==================================================================================================================
