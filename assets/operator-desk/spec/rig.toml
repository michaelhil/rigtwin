# Operator desk: declarative structure. Tree, mount frames, joints, reference frames, expected motion.
#
# Frame: metres, radians, right-handed, Z up, X forward (operator -> displays), Y to the operator's left.
# Origin: on the floor, under the centre of the desktop's front edge (the middle of the hollow front edge, dropped to the floor).
# Record formats: see assets/rig-b/spec/rig.toml and the asset contract of the modelling Skill.
#
# What is fixed and what would move: the rear wall with its canopy and the two large displays stands on the floor. The desktop
# with everything on it (shelf, small displays, keyboard unit, mouse, end screens, parts under the top) is modelled as carried by
# two lifting columns inside the legs: an ASSUMED, LOCKED height adjustment (no photo shows a second height; the real range and
# what rides with it are questions to the site).

asset = "operator-desk"
title = "Operator desk"
frame = "Metres, right-handed, Z up, X forward (from the operator toward the displays), Y to the operator's left. The origin is on the floor under the centre of the desktop's front edge."
groups = ["desk", "wall", "canopy", "displays", "input"]

# Fixed frame of the orthographic views (the first asset's default frame is 2 m wide; this object is 2.4 m).
[stage]
min = [-1.5, -1.5, -0.15]
max = [1.5, 1.5, 2.15]

# Limits for this asset: 60 000 triangles (brief); 56 draw primitives (coordinator's ruling R1: the kit merges per
# component and material only, and merging named parts would defeat the segmentation).
[budget]
triangles = 60000
primitives = 56

# Clearance sweep at the joint limits (tools/clearance.ts, part of the check): no motion of an unlocked joint, alone or in
# combination with the others, may bring two parts nearer than this unless they were that near at rest. Locked joints are
# reported, not failed. `watch` names pairs of part sets whose smallest gap is printed for every pose.
[clearance]
min = 0.02
watch = [["C_small_*,S_small_*", "C_big_display_*,S_big_*"]]

# Materials of this asset only (the shared palette has no wood, laminate or fabric).
# OPTIONAL TEXTURE LAYER: `texture` names a swatch in assets/operator-desk/textures/ (256 px, tileable, colour-neutral, sampled
# from the photos by work/operator-desk/tools/swatch.ts: nothing but the material's surface), `tile` its size in metres, `gain`
# its mean. The colour stays the authority; the swatch only modulates it. `bun run build --plain` leaves the layer out, and
# the viewer's colour setting "Plain materials" (mode=plain) hides it.
[materials]
wood_light    = { color = "#c4b69d", roughness = 0.55, texture = "wood.jpg", tile = 0.122, gain = 0.69, note = "light ash-like wood: centre of the desktop, side boards of the rear wall, canopy edge, display posts" }
laminate_grey = { color = "#c4c6c5", roughness = 0.5, note = "cool light grey laminate: desktop wings, leg blades" }
aluminium     = { color = "#d3d5d8", metallic = 0.3, roughness = 0.35, note = "bright aluminium: rails of the rear wall, canopy cap, base post" }
edge_anthracite = { color = "#3d4046", roughness = 0.55, note = "anthracite: desktop edge and body of the wings, leg edges" }
shelf_slate   = { color = "#2c323b", roughness = 0.7, note = "blue-grey shelf behind the desktop" }
base_grey     = { color = "#4b4e53", roughness = 0.8, note = "dark grey steel of the wall's base (perforated in reality)" }
housing_black = { color = "#1f2022", roughness = 0.5, note = "display housings (satin black, lighter and rougher than the glass)" }
kb_charcoal   = { color = "#3a3c40", roughness = 0.75, note = "keyboard unit body (matt charcoal)" }
key_black     = { color = "#0d0d0e", roughness = 0.45, note = "key rows and loudspeaker grilles of the keyboard unit" }
fabric_navy   = { color = "#1d2742", roughness = 0.95, note = "dark blue fabric: end screens of the desk" }
fabric_blue   = { color = "#28447a", roughness = 0.95, texture = "fabric_blue.jpg", tile = 0.27, gain = 0.69, note = "blue fabric: upper field of the rear wall (colour as photographed in IMG_1813)" }
felt_grey     = { color = "#b0b8be", roughness = 0.95, texture = "felt_grey.jpg", tile = 0.12, gain = 0.69, note = "light grey felt: lower field of the rear wall (close to the colour photographed in IMG_1816)" }
felt_slate    = { color = "#5d636a", roughness = 0.95, texture = "felt_grey.jpg", tile = 0.12, gain = 0.69, note = "mid grey felt: inner face of the end screens (darker than the wall's felt in IMG_1793 and IMG_1795)" }
felt_charcoal = { color = "#46484b", roughness = 0.95, texture = "felt_charcoal.jpg", tile = 0.12, gain = 0.69, note = "dark felt: operator side of the rear wall" }
felt_canopy   = { color = "#6b6c6d", roughness = 0.95, emissive = "#343536", texture = "felt_charcoal.jpg", tile = 0.12, gain = 0.69, note = "the same dark felt under the canopy; a weak glow stands in for the light the canopy's own strip and spots throw on it (IMG_1803, IMG_1795), since the viewer has no lamps there" }
light_white   = { color = "#f2f0e8", roughness = 0.4, emissive = "#fff7e6", note = "light strip, spotlight rings and lamps: lit" }
light_green   = { color = "#46c873", roughness = 0.4, emissive = "#3fd97a", note = "green light line of the canopy: lit" }

# ------------------------------------------------------------------------------------------------ root
[nodes.C_desk]
label = "Operator desk"
assembly = true

[nodes.D_floor]
parent = "C_desk"
label = "Floor anchor: on the floor under the centre of the desktop's front edge; x forward (operator to displays), y to the operator's left, z up"

[nodes.D_eye_seated]
parent = "C_desk"
label = "Seated eye reference (ASSUMED design reference, not a person): median adult, on the centre line; x forward, z up"
pos = ["operator.eye_x", "0", "operator.seat_height + operator.eye_above_seat"]

[nodes.D_eye_standing]
parent = "C_desk"
label = "Standing eye reference (ASSUMED design reference, not a person): median adult in shoes, on the centre line; meaningful only if the desk rises to a standing height, which is not known"
pos = ["operator.eye_x", "0", "operator.eye_standing_bare + operator.shoe"]

[nodes.D_desk_front_fixed]
parent = "C_desk"
label = "Front edge of the desktop, centre, on the surface, at the photographed height (fixed: does not follow the height adjustment)"
pos = ["0", "0", "desk.height"]

# ------------------------------------------------------------------------------------------------ desk: fixed legs
[nodes.C_leg_L]
parent = "C_desk"
group = "desk"
label = "Left leg (fixed: pale blade between bowed dark edges)"
pos = ["leg.front_x", "leg.y", "0"]
tags = ["structure", "floor"]

[nodes.C_leg_R]
parent = "C_desk"
group = "desk"
label = "Right leg (fixed: pale blade between bowed dark edges)"
pos = ["leg.front_x", "-leg.y", "0"]
tags = ["structure", "floor"]

# ------------------------------------------------------------------------------------------------ desk: what rides on the lifting columns
# Carriage frame = model frame at the photographed height (the joint is at its neutral value 0).
[nodes.C_desk_carriage]
parent = "C_desk"
group = "desk"
label = "Desktop and everything it carries (would move with the assumed height adjustment; real travel unknown)"
