[nodes.S_big_screen_R]
parent = "C_big_display_R"
group = "displays"
label = "Large display, right: lit area"
pos = ["-(big.thickness + big.mount_gap) - screen.lift", "0", "0"]
tags = ["display"]

[nodes.D_big_center_R]
parent = "S_big_screen_R"
label = "Large display, right: centre of the lit area; -x is the outward normal (toward the viewer), z up the screen"

# ------------------------------------------------------------------------------------------------ joints
# Height adjustment. ASSUMED and LOCKED (rulings R4, R12): the legs are covers of the kind that hide lifting columns, a cable
# chain hangs under the top and the touch panel shows a desk-control page, but no second height is in the photos.
# Neutral = the photographed height. The upper limit is NOT evidence of the real range: it is the output of the clearance
# solver on this model's assumed geometry (see desk.lift_travel). The real range is a question to the site.
[joints.J_desk_height]
type = "prismatic"
axis = [0, 0, 1]
lower = "0"
upper = "desk.lift_travel"
neutral = "0"
kind = "adjustment"
evidence = "assumed"
locked = true

# Tilt of the small displays about their bracket on the post. Evidence INFERRED: a pivoting bracket is seen from behind
# (one position only). Value = lean back from vertical. The limits are NOT evidence of the brackets' range: they are
# outputs of the clearance solver on assumed geometry (small.tilt_range).
[joints.J_small_tilt_1]
type = "revolute"
axis = [0, 1, 0]
pos = ["small.top_centre[0][0] - ((small.size[1] - small.pivot[1]) * sin(small.tilt) - (small.pivot[0] + small.thickness) * cos(small.tilt)) * cos(small.yaw)", "small.top_centre[0][1] - ((small.size[1] - small.pivot[1]) * sin(small.tilt) - (small.pivot[0] + small.thickness) * cos(small.tilt)) * sin(small.yaw)", "desk.height + small.top_centre[0][2] - ((small.pivot[0] + small.thickness) * sin(small.tilt) + (small.size[1] - small.pivot[1]) * cos(small.tilt))"]
rpy = ["0", "0", "small.yaw"]
lower = "small.tilt_range[0]"
upper = "small.tilt_range[1]"
neutral = "small.tilt"
kind = "adjustment"
evidence = "inferred"
locked = false

[joints.J_small_tilt_2]
type = "revolute"
axis = [0, 1, 0]
pos = ["small.top_centre[1][0] - ((small.size[1] - small.pivot[1]) * sin(small.tilt) - (small.pivot[0] + small.thickness) * cos(small.tilt))", "small.top_centre[1][1]", "desk.height + small.top_centre[1][2] - ((small.pivot[0] + small.thickness) * sin(small.tilt) + (small.size[1] - small.pivot[1]) * cos(small.tilt))"]
lower = "small.tilt_range[0]"
upper = "small.tilt_range[1]"
neutral = "small.tilt"
kind = "adjustment"
evidence = "inferred"
locked = false

[joints.J_small_tilt_3]
type = "revolute"
axis = [0, 1, 0]
pos = ["small.top_centre[0][0] - ((small.size[1] - small.pivot[1]) * sin(small.tilt) - (small.pivot[0] + small.thickness) * cos(small.tilt)) * cos(small.yaw)", "-small.top_centre[0][1] + ((small.size[1] - small.pivot[1]) * sin(small.tilt) - (small.pivot[0] + small.thickness) * cos(small.tilt)) * sin(small.yaw)", "desk.height + small.top_centre[0][2] - ((small.pivot[0] + small.thickness) * sin(small.tilt) + (small.size[1] - small.pivot[1]) * cos(small.tilt))"]
rpy = ["0", "0", "-small.yaw"]
lower = "small.tilt_range[0]"
upper = "small.tilt_range[1]"
neutral = "small.tilt"
kind = "adjustment"
evidence = "inferred"
locked = false

# Tilt of the large displays in their wall brackets. Evidence ASSUMED (mechanism class only), probably set at installation:
# locked. Value = forward tilt (top edge toward the operator). The limits are outputs of the clearance solver on assumed
# geometry (big.tilt_range), not evidence of a range.
[joints.J_big_tilt_L]
type = "revolute"
axis = [0, -1, 0]
pos = ["big.centre[0] - wall.front_x + (big.thickness + big.mount_gap) * cos(big.tilt) * cos(big.yaw)", "big.centre[1] + (big.thickness + big.mount_gap) * cos(big.tilt) * sin(big.yaw)", "big.centre[2] + (big.thickness + big.mount_gap) * sin(big.tilt)"]
rpy = ["0", "0", "big.yaw"]
lower = "big.tilt_range[0]"
upper = "big.tilt_range[1]"
neutral = "big.tilt"
kind = "adjustment"
evidence = "assumed"
locked = true

[joints.J_big_tilt_R]
type = "revolute"
axis = [0, -1, 0]
pos = ["big.centre[0] - wall.front_x + (big.thickness + big.mount_gap) * cos(big.tilt) * cos(big.yaw)", "-big.centre[1] - (big.thickness + big.mount_gap) * cos(big.tilt) * sin(big.yaw)", "big.centre[2] + (big.thickness + big.mount_gap) * sin(big.tilt)"]
rpy = ["0", "0", "-big.yaw"]
lower = "big.tilt_range[0]"
upper = "big.tilt_range[1]"
neutral = "big.tilt"
kind = "adjustment"
evidence = "assumed"
locked = true

# ------------------------------------------------------------------------------------------------ expected motion
# When the desk height changes: the desktop, shelf, tray, block, side panels, lifting columns, the small displays with their
# posts, the keyboard unit and the mouse move, with the frames on them. Legs, rear wall, canopy and large displays do not.
[motion]
J_desk_height = ["C_desk_carriage", "C_desk_top", "C_desk_shelf", "C_desk_tray", "C_desk_handset", "C_wing_*", "C_leg_column_*", "C_small_*", "S_small_*", "D_small_*", "C_keyboard", "S_keyboard_touch", "D_keyboard", "D_touch_center", "C_mouse", "D_desk_front_edge", "D_desk_surface"]
J_small_tilt_1 = ["C_small_display_1", "S_small_screen_1", "D_small_center_1"]
J_small_tilt_2 = ["C_small_display_2", "S_small_screen_2", "D_small_center_2"]
J_small_tilt_3 = ["C_small_display_3", "S_small_screen_3", "D_small_center_3"]
J_big_tilt_L = ["C_big_display_L", "S_big_screen_L", "D_big_center_L"]
J_big_tilt_R = ["C_big_display_R", "S_big_screen_R", "D_big_center_R"]

# ------------------------------------------------------------------------------------------------ left / right
[symmetry]
single = []
free = []
