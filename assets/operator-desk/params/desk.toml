# Operator desk: desktop, legs, wing panels, shelf, parts under the top. Frame: X forward (operator -> displays), Y to the
# operator's left, Z up; origin on the floor under the centre of the desktop's front edge.
# How the photo values were made (the same words are used in every evidence text):
#   "rule photo"   IMG_1820: ultra-wide photo from above with a metre rule on the desktop. The plane is rectified from the photo's own
#                  gravity vector and focal length; scale from the rule's graduations (reproduced to 2 mm over 90 cm); depth scale
#                  closed on the keyboard's key pitch (19.0 mm found, 19.05 mm standard).
#   "one ray"      a sight line of a main-lens photo cut with a named plane; the three photo cameras (IMG_1794, 1795, 1796) have
#                  roll and pitch from gravity and are placed on four desktop features taken from the rule photo (residuals 2-28 mm).
#   "two-view"     the same feature in two or three of those photos, sight lines 50-110 degrees apart; gaps of 5-40 px (4-30 mm).
#   "app label"    a size label of the phone's measuring app in a screenshot (IMG_1784-1792, 1802-1806, 1812-1819). Against the
#                  rule and against repeated spans these labels read between 1.5 % and 17 % short, so +-3 cm is the least they carry.

