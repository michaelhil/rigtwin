# Canopy on top of the rear wall. Method words are explained at the top of desk.toml.

[canopy.depth]
value = 0.87
unit = "m"
range = 0.06
class = "photo"
tier = "layout"
evidence = "Front lower corners (three photos) lie over the desktop's front edge; the post junctions lie 0.87 m (right) and 0.89 m (left) behind them. Each side's depth rests on ONE oblique view paired with the front photo, which looks almost along the side edge: weaker than a true two-view size. Range 0.81-0.93 m, with an UNEXPLAINED app reading of 0.73 m for the same span (canopy.depth_app), outside it; an earlier single-ray result (0.79-0.83 m) grazed its plane and is discarded. Two checks speak against 0.73 m: the independent auditor's pixel distances in IMG_1793 (868 px seen, 883 predicted for 0.89 m, 755 for 0.73 m; right side 619 seen, 539 and 466 predicted) and the what-if drill. First item of the tape request."

[canopy.depth_app]
value = 0.73
unit = "m"
range = 0.03
class = "photo"
tier = "layout"
evidence = "STATED FIGURE from the phone's measuring app (an instrument reading of unknown quality, +-3 cm at best; not a tape value). One app measurement, visible in five screenshots (IMG_1788-1792): along the lower edge of the canopy's side, from the front corner to where it meets the post. Not modelled: two-view gives 0.87-0.89 m for what looks like the same span. Which rear point the app used is not certain. First item of the measurement request."

