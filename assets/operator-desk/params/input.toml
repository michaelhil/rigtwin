# Keyboard unit with its touch panel, and the mouse. Both are loose objects on the desktop: positions are as photographed.
# Method words are explained at the top of desk.toml.

[keyboard.size]
value = [0.38, 0.47]
unit = "m"
range = 0.02
class = "photo"
tier = "layout"
evidence = "Rule photo: width 0.471 m between the front corners on the desktop plane (0.462 m by one ray in IMG_1795); depth 0.37-0.39 m from the front edge to the rear of the loudspeaker blocks, with their height assumed."

[keyboard.front_xy]
value = [0.165, 0.01]
unit = "m"
range = 0.02
class = "photo"
tier = "layout"
evidence = "Rule photo and one ray in IMG_1795: front edge 0.16-0.18 m behind the desktop's front edge, centre 1 cm left of the axis. A loose object; it had not moved by more than 2.5 cm between the two photos."

[keyboard.rest]
value = [0.06, 0.018]
unit = "m"
class = "photo"
tier = "cosmetic"
evidence = "Rule photo, one ray with assumed heights: depth and height of the palm rest at the front of the unit."

[keyboard.deck]
value = [0.14, 0.022, 0.040]
unit = "m"
class = "photo"
tier = "layout"
evidence = "Rule photo, one ray with assumed heights: depth of the part that carries the keys, and its height at the front and at the rear. The key pitch on it measures 19.0 mm both ways."

[keyboard.keys]
value = [0.115, 0.435, 0.004]
unit = "m"
class = "photo"
tier = "cosmetic"
evidence = "Rule photo: depth and width of the field of keys (keys are not modelled one by one); raised by the third number as a modelling device."

[keyboard.rear]
value = [0.18, 0.05]
unit = "m"
class = "photo"
tier = "cosmetic"
evidence = "Rule photo, one ray with assumed heights: depth and height of the rear block with the two loudspeaker grilles."

[keyboard.touch]
value = [0.262, 0.165, 0.02]
unit = "m"
class = "photo"
tier = "layout"
evidence = "Rule photo, one ray with assumed heights: width, sloping length and thickness of the touch panel's housing between the loudspeakers. The lit area measures about 0.25 by 0.14 m."

[keyboard.touch_slope]
