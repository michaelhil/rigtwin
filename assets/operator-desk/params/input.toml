unit = "deg"
range = 8
class = "photo"
tier = "layout"
evidence = "Rule photo with assumed heights of the panel's lower and upper edge (4.5 and 10 cm above the desktop); the close photos (IMG_1799, IMG_1800) show a shallow slope. Weak."

