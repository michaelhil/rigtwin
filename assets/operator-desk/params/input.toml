[keyboard.key_row_count]
value = 6
unit = "count"
class = "assumed"
basis = "convention"
tier = "cosmetic"
evidence = "The key field is drawn as six rows (a full keyboard with a function row) with a groove between them. Keys are not modelled one by one."

[keyboard.key_row_depth]
value = 0.0155
unit = "m"
class = "assumed"
basis = "convention"
tier = "cosmetic"
