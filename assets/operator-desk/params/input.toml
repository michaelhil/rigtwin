[keyboard.block_rise]
value = 0.5
unit = "ratio"
class = "assumed"
basis = "by_eye"
tier = "cosmetic"
evidence = "The two loudspeaker blocks beside the touch panel are boxes whose tops slope toward the operator like the panel and reach about half its height (IMG_1799, IMG_1793): height of a block's rear edge as a share of the touch panel's rise."
