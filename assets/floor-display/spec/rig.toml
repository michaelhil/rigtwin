asset = "floor-display"
title = "Freestanding display"
frame = "Metres, right-handed, Z up. The screen faces -X. The origin is the floor projection of the mounting centre."
groups = ["display"]

[nodes.C_display]
label = "Freestanding display"
assembly = true

[nodes.D_floor]
parent = "C_display"
label = "Floor anchor"

[nodes.C_mount]
parent = "C_display"
group = "display"
label = "Floor stand"

[nodes.C_panel]
parent = "C_display"
group = "display"
label = "Display housing"
pos = ["-display.standoff", 0, "display.centre"]

[nodes.S_screen]
parent = "C_panel"
group = "display"
label = "Active screen"
pos = ["-display.thickness / 2 - display.glass_lift", 0, 0]

[nodes.D_screen_center]
parent = "S_screen"
label = "Screen centre"
