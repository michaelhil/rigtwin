pos = ["pedals.pad_top_edge[0] - pedals.heel_lip_x - pedals.arm_reach * sin(pedals.arm_angle) + pedals.pad_face_offset * cos(pedals.arm_angle)", "0", "pedals.pad_top_edge[1] - pedals.arm_reach * cos(pedals.arm_angle) - pedals.pad_face_offset * sin(pedals.arm_angle)"]
rpy = ["0", "pedals.arm_angle", "0"]
lower = "0"
upper = "pedals.travel"
neutral = "0"
kind = "control"
evidence = "seen"
locked = false
signal = "pedal_2"

[joints.J_pedal_3]
