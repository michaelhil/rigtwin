# Ball joints: neutral is a roll/pitch/yaw triple; lower/upper bound each of the three offsets.
[joints.J_ts_arm]
type = "ball"
pos = ["pods.ts_base_xy[0]", "pods.ts_base_xy[1]", "pods.ts_base_height"]
lower = "-pods.ts_ball_range"
upper = "pods.ts_ball_range"
neutral = ["pods.ts_arm_rpy[0]", "pods.ts_arm_rpy[1]", "pods.ts_arm_rpy[2]"]
kind = "adjustment"
evidence = "seen"
locked = false

[joints.J_ts_screen]
type = "ball"
pos = ["0", "0", "pods.ts_arm_length"]
lower = "-pods.ts_ball_range"
upper = "pods.ts_ball_range"
neutral = ["pods.ts_screen_rpy[0]", "pods.ts_screen_rpy[1]", "pods.ts_screen_rpy[2]"]
kind = "adjustment"
evidence = "seen"
locked = false

# Height: the arm's collar slides along the post, which stands square on the tilted shelf (joint Z = post axis).
# The gas-spring link's own lift is not a joint: the links are posed by parameters and move as one piece.
[joints.J_mon_height]
type = "prismatic"
axis = [0, 0, 1]
pos = ["stand.arm_collar_height * sin(stand.shelf_tilt)", "0", "stand.arm_collar_height * cos(stand.shelf_tilt)"]
rpy = ["0", "stand.shelf_tilt", "0"]
lower = "stand.arm_slide_limits[0] - stand.arm_collar_height"
upper = "stand.arm_slide_limits[1] - stand.arm_collar_height"
neutral = "0"
kind = "adjustment"
evidence = "inferred"
locked = false

# Positive = top of the screen tips away from the operator.
[joints.J_mon_tilt]
type = "revolute"
axis = [0, 1, 0]
pos = ["stand.monitor_centre[0] + monitor.depth_centre - stand.arm_post_xy[0] - stand.arm_collar_height * sin(stand.shelf_tilt)", "stand.monitor_centre[1] - stand.arm_post_xy[1]", "stand.monitor_centre[2] - (stand.shelf_top_z_near_edge - (stand.arm_post_xy[0] - stand.shelf_near_edge_x) * tan(stand.shelf_tilt)) - stand.arm_collar_height * cos(stand.shelf_tilt)"]
lower = "-stand.monitor_tilt_range"
upper = "stand.monitor_tilt_range"
neutral = "stand.monitor_tilt"
kind = "adjustment"
evidence = "inferred"
locked = false

[joints.J_mon_pan]
type = "revolute"
axis = [0, 0, 1]
lower = "-stand.monitor_pan_range"
upper = "stand.monitor_pan_range"
neutral = "0"
kind = "adjustment"
evidence = "inferred"
locked = false

[joints.J_pedal_tray]
type = "prismatic"
axis = [1, 0, 0]
pos = ["pedals.heel_lip_x", "pedals.centre_y", "0"]
lower = "-pedals.tray_range"
upper = "pedals.tray_range"
neutral = "0"
kind = "adjustment"
evidence = "assumed"
locked = true

# Pedal frame: origin on the hinge axis, +Z along the arm toward the pad. Positive = pressed (pad moves forward and down).
[joints.J_pedal_1]
type = "revolute"
axis = [0, 1, 0]
pos = ["pedals.pad_top_edge[0] - pedals.heel_lip_x - pedals.arm_reach * sin(pedals.arm_angle) + pedals.pad_face_offset * cos(pedals.arm_angle)", "pedalset.pitch", "pedals.pad_top_edge[1] - pedals.arm_reach * cos(pedals.arm_angle) - pedals.pad_face_offset * sin(pedals.arm_angle)"]
rpy = ["0", "pedals.arm_angle", "0"]
lower = "0"
upper = "pedals.travel"
neutral = "0"
kind = "control"
evidence = "seen"
locked = false
signal = "pedal_1"

[joints.J_pedal_2]
type = "revolute"
