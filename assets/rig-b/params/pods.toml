# The touchscreen on Rig B is the 13.3 inch size, not the 15.6 inch one in devices.toml (coordinator ruling,
# measurement report section 5). These records replace the device records.
[touchscreen]
outer_height  = { value = 0.205, unit = "m", range = 0.008, class = "photo", tier = "layout", evidence = "Left housing corners triangulated IMG_2530 + IMG_2532 (0.4 to 2.2 px, 38 deg). 0.84 of the 15.6 inch model's height: the screen is the 13.3 inch size." }
outer_width   = { value = 0.33, unit = "m", range = 0.03, class = "assumed", basis = "by_eye", tier = "layout", evidence = "0.387 scaled by the measured height ratio (dimension table); the vendor sheet for the 13.3 inch size was not checked. A free fit of the housing rectangle to IMG_2530 and IMG_2532 prefers 0.36 to 0.39 (residual 4.6 px against 8 px at 0.33), so the width and the turn of the screen are not separable from these photos." }
depth         = { value = 0.030, unit = "m", range = 0.006, class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Housing depth: the 15.6 inch model's 0.0329 scaled roughly by the same ratio; vendor sheet not checked." }
active_height = { value = 0.1655, unit = "m", range = 0.006, class = "photo", tier = "layout", evidence = "Active-area corners on the left edge triangulated IMG_2530 + IMG_2532: 0.1655 (a 13.3 inch 16:9 panel is 0.165 high)." }
