# Pods group: both armrest pods with joysticks, controls, touchscreen and its arm.
#
# POD FRAME (nodes C_pod_L / C_pod_R): origin on the top surface of the black control plate at the
# joystick axis; Y to the operator's left; pitched by plate_tilt so that X runs forward ALONG the
# plate (front low) and Z is the plate normal.
# LEVEL COORDINATES (used by most shape lists below): same origin, but x forward horizontal,
# z up; y is positive toward the OUTER side of the left pod. The code turns them into the pod
# frame. Rig coordinates of the left pod origin: x -0.19, y +0.3165, z 0.546; a rig point
# (X, Y, Z) is level (X + 0.19, |Y| - 0.3165, Z - 0.546).
# Lists are written for the LEFT pod; the right pod mirrors them unless a key ends in _R.
# Positions of the things on the plates (spec mount frames) are pod-frame x, y: x = level x / cos(tilt).

[pods]
# ---------------------------------------------------------------- placement
joy_x            = { value = -0.19, unit = "m", range = 0.02, class = "photo", tier = "critical", evidence = "Rig x of both joystick axes. Dimension table pods.joystick_L_base_xy / _R_base_xy: centre of the square plinth, IMG_2532 rays on the plate plane; -0.19 on both sides." }
joy_y            = { value = 0.3165, unit = "m", range = 0.02, class = "photo", tier = "critical", evidence = "Distance of each joystick axis from the centre line. Dimension table: left +0.318, right -0.315 (single view on the plate plane); the mean is used so the pods are mirror images. Centre spacing 0.633." }
plate_front_z    = { value = 0.519, unit = "m", range = 0.012, class = "photo", tier = "critical", evidence = "Plate top above the deck at the front screws (rig x -0.025). Dimension table: right 0.527 +/- 0.010 (two screws, two views), left 0.510 +/- 0.015 (one screw, two views). CONFLICT kept visible: the sides differ by 17 mm; the model uses the mean for both so that the pods are mirror images." }
plate_front_ref_x = { value = -0.025, unit = "m", range = 0.01, class = "photo", tier = "layout", evidence = "Rig x of the front plate screws at which plate_front_z was triangulated (-0.02 to -0.03)." }
plate_tilt       = { value = 9.3, unit = "deg", range = 2.5, class = "photo", tier = "critical", evidence = "Dimension table pods.plate_tilt_deg: inner edge of the left plate traced in IMG_2530 and IMG_2532 and intersected as a 3D line (dz/dx -0.164), front edge low. Rig C1 about 12 deg. Toe-in measured 0 +/- 1 deg, so none is modelled." }

