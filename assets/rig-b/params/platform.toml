# Platform group and rig-level layout numbers.
# Frame: origin at the centre of the deck's top surface; the deck edges are at x = +-deck_length_x / 2, y = +-deck_width_y / 2.

[platform]
deck_width_y   = { value = 1.50, unit = "m", range = 0.03, class = "measured", basis = "user", tier = "critical", evidence = "User, verbal, 2026-11-23: platform 1.5 x 1.5 m. Taken as the lateral width of the black deck (inner edge of the white rim); scale unit of the whole frame. Closure against purchased parts: soundbar 1.003, pedal pitch 1.00, monitor 1.02 (work/measure/REPORT.md)." }
deck_length_x  = { value = 1.41, unit = "m", range = 0.02, class = "photo", tier = "critical", evidence = "Two views. Deck edge lines traced in IMG_2511 and IMG_2530, bundle adjustment: length/width = 0.941. Conflicts with the user's 1.5 x 1.5: the deck is about 0.09 m shorter front to back than it is wide (coordinator ruling: model 1.41)." }
rim_width      = { value = 0.015, unit = "m", range = 0.005, class = "photo", tier = "cosmetic", evidence = "Single view. White rim top surface, ray on deck plane: 0.012 (IMG_2530 front), 0.017 (IMG_2511 front), 0.015 (IMG_2511 left). Outer size about 1.44 x 1.53." }
deck_corner_radius = { value = 0.03, unit = "m", range = 0.01, class = "photo", tier = "cosmetic", evidence = "Single view. Front-right corner in IMG_2530: tangent points 0.028 and 0.031 from the virtual corner. The outer corner radius is this plus the rim width." }
deck_height    = { value = 0.20, unit = "m", range = 0.015, class = "photo", tier = "layout", evidence = "Two views. Deck top above the room floor: floor plane through 21 structure-from-motion points lies 0.198 below the deck at the origin (0.189-0.208 under the corners)." }
white_band_height = { value = 0.105, unit = "m", range = 0.01, class = "photo", tier = "cosmetic", evidence = "Two views. Brightness read along vertical lines on the outer faces through the solved cameras, at 1 cm steps below the deck: the white band ends between 0.10 and 0.11 on the rear face (two positions, IMG_2530 and IMG_2511) and between 0.09 and 0.11 on the right face (two positions, both photos). The measurement table's 0.15 came from one steep pick; Rig C1 in IMG_2515 also shows about 0.10. The dark plinth takes the rest of the deck height (0.095); on Rig C1 it looks nearer 0.05, so Rig B may stand on something taller (castors are visible beside it in IMG_2530)." }
plinth_inset   = { value = 0.04, unit = "m", class = "assumed", basis = "cross_instance", tier = "cosmetic", evidence = "Recessed dark plinth, visible only on Rig C1/C2 (IMG_2515); hidden under the overhang on Rig B. Inset by eye." }
rim_edge_radius = { value = 0.009, unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Roundover of the rim's upper outer edge, by eye from the IMG_2530 side-band crop and IMG_2515 (soft highlight along the edge, a bit over half the rim width)." }
edge_bevel     = { value = 0.003, unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Small chamfer on the lower edge of the white band, the plinth and the deck panel edge, by eye." }
deck_gap       = { value = 0.002, unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Width of the open joint between deck panels and between panels and rim (IMG_2530 side-band crop), by eye." }
deck_pocket    = { value = 0.008, unit = "m", class = "invented", tier = "cosmetic", evidence = "Depth of the pocket in the rim: lower half a dark base, upper half the deck panels; modelling device, not observed." }
deck_panel_chamfer = { value = 0.0025, unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Chamfer on the upper edges of the deck panels; with the open joint it makes a groove about 7 mm wide, which reads as the fine seams of IMG_2530 without breaking into dashes at a distance." }
deck_panels_side = { value = [[[-0.705, 0.252], [-0.26, 0.252], [-0.26, 0.75], [-0.705, 0.75]], [[-0.26, 0.252], [0.255, 0.252], [0.255, 0.75], [-0.26, 0.75]], [[0.255, 0.252], [0.47, 0.252], [0.47, 0.385], [0.705, 0.385], [0.705, 0.75], [0.255, 0.75]], [[0.47, 0.252], [0.705, 0.252], [0.705, 0.385], [0.47, 0.385]]], unit = "m", range = 0.02, class = "photo", tier = "cosmetic", evidence = "Single view. Outlines (x, y) of the deck panels on the left half, mirrored to the right: rear, middle, front (L-shaped) and the small hatch beside the column. Joint positions from rays on the deck plane (modeller picks, solved cameras): IMG_2530 gives the fore-aft joint at y -0.250 to -0.255 (four points), lateral joints at x -0.26 and 0.23-0.25, hatch corner at (0.47, -0.385); IMG_2532 gives y +0.251 / -0.253, lateral joint x 0.24 / 0.28, hatch corners (0.47, +0.37) and (0.47, -0.38)." }
deck_panels_centre = { value = [[[-0.705, -0.252], [0.705, -0.252], [0.705, 0.252], [-0.705, 0.252]]], unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Centre strip between the two fore-aft joints, drawn as one panel: its own joints are hidden under the seat and the pedal tray." }
fitting_xy     = { value = [[-0.48, 0.68], [-0.015, 0.68], [-0.48, -0.675], [-0.015, -0.68]], unit = "m", range = 0.015, class = "photo", tier = "layout", evidence = "Single view. Flush pull handle centres. Right pair: rays on the deck in IMG_2530 and IMG_2511 (agree within 6-8 mm). Left pair mirrored (cross-instance: mirrored positions land within 5-8 px of the handles of Rig C1 and C2); a partly hidden object read as a left handle at (-0.41, 0.46) in IMG_2530 conflicts and was not used." }
fitting_size   = { value = [0.11, 0.07], unit = "m", range = 0.01, class = "photo", tier = "cosmetic", evidence = "Single view. Handle recess about 0.11 x 0.07, long side along the platform edge (IMG_2530)." }
fitting_lip    = { value = [0.011, 0.003, 0.0006], unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Width and proud height of the handle frame, by eye from the IMG_2530 side-band crop; third entry: height of the pocket floor above the deck (the pocket is not cut into the deck; modelling device)." }
fitting_paddle = { value = [0.05, 0.036, 0.0022, 0.012], unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Pull paddle inside the frame: length, width, height above the pocket floor, offset of its centre along the long side; by eye from the IMG_2530 side-band crop." }

[layout]
eye_to_display = { value = 1.20, unit = "m", range = 0.05, class = "measured", basis = "user", tier = "critical", evidence = "User, verbal, 2026-11-23: head-to-display distance 1.20 m. Read as provisional eye point to main-screen centre; the reading is an interpretation. The photos fit back-of-head to screen (1.14-1.21), not eye to screen centre (0.97-1.05) in the photographed pose (work/measure/REPORT.md section 6)." }
eye_height     = { value = 1.22, unit = "m", range = 0.05, class = "assumed", basis = "standard_default", tier = "layout", evidence = "Seated eye height about 0.73 m above a cushion top near 0.49 m; anthropometric default, not observed." }
