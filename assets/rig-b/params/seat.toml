# Seat references. D_seat_ref_fixed: top of the pedestal on the swivel axis (pedestal_height above the deck); it does not move with any adjustment.
# D_seat_ref_live: on the centre line where the modelled cushion top (cushion_top_z_rear) meets the modelled backrest surface (backrest_surface_x_at_cushion);
# it moves with swivel, height, slide and tilt. Both are estimated from the modelled surfaces; neither is a standardised seat index point or H-point.
# Eye points: from D_seat_ref_live, lowered by the cushion compression, then eye_height along the torso line (parallel to the back, recline_neutral)
# and eye_forward at right angles to it. They are computed for the neutral recline and move with the seat base, not with the recline joint.
eye_height_small = { value = 0.685, unit = "m", range = 0.03, class = "assumed", basis = "standard_default", tier = "layout", evidence = "Sitting eye height above the seat surface, small woman (5th percentile female). Value quoted from memory of the British adult tables in Pheasant and Haslegrave, Bodyspace (women 685 / 740 / 795 mm for the 5th / 50th / 95th percentile); not looked up for this build, and populations differ by 20-30 mm." }
eye_height_median = { value = 0.765, unit = "m", range = 0.03, class = "assumed", basis = "standard_default", tier = "layout", evidence = "Sitting eye height above the seat surface, median adult: midway between the 50th percentile woman (740 mm) and man (790 mm) of the same tables (Pheasant and Haslegrave, Bodyspace; from memory, not looked up for this build). With the other eye parameters the median eye comes to x -0.55, z 1.155, about 0.90 from the main screen centre: the user's figure of 1.2 m from head to display does not fit eye-to-screen-centre in the photographed pose; it fits the back of the head or the head pad (1.14-1.21)." }
eye_height_large = { value = 0.845, unit = "m", range = 0.03, class = "assumed", basis = "standard_default", tier = "layout", evidence = "Sitting eye height above the seat surface, tall man (95th percentile male; men 735 / 790 / 845 mm in the same tables, Pheasant and Haslegrave, Bodyspace; from memory, not looked up for this build)." }
eye_forward      = { value = 0.20, unit = "m", range = 0.04, class = "assumed", basis = "standard_default", tier = "layout", evidence = "Eye ahead of the torso line through the seat reference (the plane of the backrest surface), one value for all three sizes: head depth about 0.19, eye about 0.17 ahead of the back of the head, back of the head a few centimetres ahead of the back plane. Rough figures from memory of general anthropometry, no single source. Puts the median eye 0.22 ahead of the head pad." }
eye_cushion_compression = { value = 0.02, unit = "m", range = 0.015, class = "assumed", basis = "by_eye", tier = "layout", evidence = "How far a seated person sinks into the cushion below the unloaded surface the model shows; a guess for a firm upholstered seat." }
