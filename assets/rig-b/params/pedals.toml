# Pedals group. Pedal frame: on the deck at the operator-side lip of the heel plate, centred on the unit.
# Positions with "rig frame" in the evidence are in the rig frame; the rest are local sizes.

[pedals]
heel_lip_x    = { value = 0.20, unit = "m", range = 0.03, class = "photo", tier = "critical", evidence = "Single view. Operator-side edge of the heel plate, rig frame, IMG_2532: x 0.226 if it lies on the deck, 0.199 at 0.04 above, 0.185 at 0.06. About 0.50 behind the deck front edge." }
centre_y      = { value = 0.0, unit = "m", range = 0.01, class = "photo", tier = "layout", evidence = "Two views. Middle pad corners at y +0.036 and -0.034 (triangulated); heel-plate edge centre +0.003." }
tray_range    = { value = 0.10, unit = "m", class = "assumed", basis = "standard_default", tier = "layout", evidence = "The pedal unit sits on a sliding tray in a deck channel (IMG_2532); range assumed." }
heel_width    = { value = 0.41, unit = "m", range = 0.015, class = "photo", tier = "layout", evidence = "Single view. Heel-plate lip, IMG_2532: 0.420 at deck level, 0.408 at 0.04, 0.402 at 0.06. Wider than the vendor's 0.388 unit width; not used for scale." }
heel_far_edge_x = { value = 0.40, unit = "m", range = 0.03, class = "photo", tier = "layout", evidence = "Single view. Far edge of the heel plate, rig frame, IMG_2532 at an assumed 0.04 above the deck (0.434 on the deck)." }
heel_profile  = { value = [[0.0, 0.0], [1.0, 0.0], [1.0, 0.078], [0.872, 0.0735], [0.862, 0.068], [0.808, 0.066], [0.798, 0.071], [0.2, 0.05], [0.07, 0.04], [0.0, 0.028]], unit = "m", class = "assumed", basis = "cross_instance", tier = "cosmetic", evidence = "Side profile of the heel plate: first entry of each pair is the fraction of the plate length from the lip, second the height above the tray in metres. A low wedge with a short steeper nose and the cross slot near its far end (drawn as a groove over the full width), by eye from Rig C1's side view (IMG_2515) and IMG_2532; its height was not measurable." }
tray          = { value = [-0.17, 0.39, 0.44, 0.008, 0.02], unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Sliding tray under the unit: start and end along X from the heel lip, width, plate thickness, height of the upturned side flanges. Flange lines seen at y +-0.21 to +-0.225 from x 0.12 to 0.57 (IMG_2532 rays on the deck); rear end hidden under the seat." }
frame_rail    = { value = [0.012, 0.045, 0.15], unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Side plates of the frame behind the heel plate: thickness, height of the low rail, height of the short upright that carries the cross-rails; by eye from IMG_2532." }
