pad_top_edge  = { value = [0.475, 0.235], unit = "m", range = 0.01, class = "photo", tier = "critical", evidence = "Two views. x and z of the pads' upper edge in the rig frame: three triangulated corners (IMG_2530 + IMG_2532), x 0.473-0.479, z 0.232-0.238." }
