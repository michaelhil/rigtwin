# Stand group: columns, shelf, soundbar position, monitor arm, monitor pose.
# All positions are in the rig frame (origin deck-top centre) unless a record says otherwise.
# Stand frame: on the deck, centred between the column feet.

[stand]
centre_y           = { value = 0.005, unit = "m", range = 0.01, class = "photo", tier = "layout", evidence = "Single view. Mean of the two column foot centres (+0.283, -0.274), IMG_2532 rays on the deck." }
column_rear_nose_x = { value = 0.277, unit = "m", range = 0.012, class = "photo", tier = "critical", evidence = "Single view. Operator-side nose of both column feet on the deck: 0.278 (left), 0.275 (right) in IMG_2532; 0.29 for the right foot in IMG_2530 (rounded silhouette). 0.43 behind the deck front edge." }
column_inner_gap   = { value = 0.48, unit = "m", range = 0.012, class = "photo", tier = "critical", evidence = "Single view. Between the inner silhouettes of the feet (IMG_2532 on the deck): 0.479. Outer span 0.633." }
column_width       = { value = 0.077, unit = "m", range = 0.008, class = "photo", tier = "layout", evidence = "Single view. Lateral width of the column feet on the deck: 0.075 (left), 0.079 (right), IMG_2532. Taken as constant up the column." }
column_depth_foot  = { value = 0.22, unit = "m", range = 0.02, class = "photo", tier = "layout", evidence = "Single view. Fore-aft depth of the column foot (the section is D-shaped, see column_face_corner_radius; the depth was fitted with an obround and kept unchanged when the operator end was made flat). Silhouette edges read off IMG_2530 rows near the deck and compared with the projected obround (lateral width 0.077 from IMG_2532, operator-side nose fixed at 0.277): right column 0.21, left column 0.235. The measurement table has 0.15 +-0.03; that figure took the sight line at 40 deg to the X axis, but the ray from the solved camera to the right column is at 24 deg, which turns the same 0.155 projected width into about 0.25." }
column_depth_top   = { value = 0.245, unit = "m", range = 0.02, class = "photo", tier = "layout", evidence = "Single view. Depth of the column head under the shelf, same method as the foot (IMG_2530 rows at z 0.66): right 0.25, left 0.245. The two rows of shelf fixing nuts (0.175 apart) then sit 3 and 4 cm inside the head, and the head's outer front corner reaches the shelf's far corner arc as in IMG_2530. Table: 0.19 +-0.04. Taper is slight: about 2 cm over the height." }
column_head_centre_x = { value = 0.5175, unit = "m", range = 0.015, class = "photo", tier = "critical", evidence = "Single view. Centre of the column head on the shelf underside, rig frame: the head's operator-side nose at x 0.395 (edge of the column in IMG_2530 at three heights, within 1-2 px of a straight line from the foot nose) plus half the head depth; 7 mm in front of the middle of the two nut rows. Resulting lean, tops away from the operator: operator-side edge 9 deg (table's direct check 8.2), axis 9.9 deg, equal to the shelf tilt, so the columns stand square to the shelf." }
column_bevel       = { value = [0.008, 0.003], unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Chamfer at the column foot (visible tuck-in at the deck in IMG_2532) and at the head, by eye." }
column_face_corner_radius = { value = 0.012, unit = "m", range = 0.004, class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Column SECTION (corrects the brief's 'obround', review round 2 N2): D-shaped. A FLAT face toward the operator, 77 mm wide (column_width), meets the two long flat sides at tight rounded corners of this radius; the far end (away from the operator) is a half-round of the full width. Flat face: IMG_2532 (both columns from the operator's eye: each shows a flat front face and a darker side face with a sharp light/dark boundary running the whole length; crops stand_B_operator-view_2532, shelf_B_left_2532). Far end: IMG_2530 (crop stand_B_rear-right_2530, review crop column_R_foot_2530): the right column's operator face and outer side meet at a crisp vertical line, while the side face's foot line curves smoothly round the far end and the far silhouette shades softly, so the far end is round, not flat. Radius 10 to 15 mm by eye from the width of the highlight on the corner line." }
shelf_tilt         = { value = 9.9, unit = "deg", range = 0.8, class = "photo", tier = "critical", evidence = "Two views. Shelf is not horizontal: far edge (away from the operator) lower. Plane through 7 triangulated nut tops (rms 0.3 mm)." }
shelf_top_z_near_edge = { value = 0.785, unit = "m", range = 0.01, class = "photo", tier = "critical", evidence = "Two views. Shelf top at its operator-side edge (x 0.385): nut-top plane minus 3 mm. With the tilt the far edge comes to 0.731 (table 0.735 +-0.012)." }
shelf_near_edge_x  = { value = 0.385, unit = "m", range = 0.012, class = "photo", tier = "critical", evidence = "Single view. Operator-side edge, IMG_2532 on the shelf plane: 0.397 (left), 0.386 (middle), 0.382 (right)." }
shelf_far_edge_x   = { value = 0.695, unit = "m", range = 0.02, class = "photo", tier = "layout", evidence = "Single view. Far edge: 0.69 (IMG_2532, both sides of the soundbar), 0.70 (IMG_2530)." }
shelf_length       = { value = 0.65, unit = "m", range = 0.012, class = "photo", tier = "layout", evidence = "Single view. Outline in IMG_2532 intersected with the shelf plane: y from -0.324 to +0.326." }
shelf_thickness    = { value = 0.02, unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Edge thickness as seen in IMG_2532 and IMG_2530." }
shelf_corner_radii = { value = [0.14, 0.03], unit = "m", range = 0.03, class = "photo", tier = "cosmetic", evidence = "Single view. Far and near corner radius in plan. Far corners are large arcs: the seven outline points per side in work/measure/shape-points.toml fit a circle of radius 0.13-0.14 centred near (0.555, +-0.185) (the table's 0.17 leaves the last two points 1 cm outside). Near corners about 0.03. The shelf is a D shape, not a stadium." }
shelf_edge_radius  = { value = 0.004, unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Small radius on the top and bottom edges of the shelf plate, by eye from the IMG_2532 shelf crops." }
arm_post_xy        = { value = [0.69, 0.01], unit = "m", range = 0.03, class = "photo", tier = "layout", evidence = "Two views. White post axis at shelf level, short segments triangulated in IMG_2530 + IMG_2532 (28 deg): 0.705, 0.01. Moved 15 mm toward the operator (inside the range) so the post stands on the shelf just inside its far edge." }
arm_post_height    = { value = 0.24, unit = "m", class = "assumed", basis = "cross_instance", tier = "cosmetic", evidence = "Post length along its axis. Only the lowest 0.065 is visible on Rig B; length by eye from the same arm on Rig C1 (IMG_2517). The post stands square on the tilted shelf: it leans about 5 deg in IMG_2530, as a 9.9 deg forward lean would at that heading." }
arm_collar_height  = { value = 0.15, unit = "m", class = "assumed", basis = "by_eye", tier = "layout", evidence = "Position of the arm's sliding collar along the post, from the shelf, in the photographed pose. Hidden behind the monitor; chosen so the two links reach the measured monitor centre." }
arm_slide_limits   = { value = [0.055, 0.21], unit = "m", class = "assumed", basis = "by_eye", tier = "layout", evidence = "Lowest and highest collar position along the post: the collar clears the base ring and stays on the post. This is the whole range of the monitor height joint (about -0.095 to +0.06 m). Round 1 used the vendor lift of the gas-spring link (0.29 m) on a rigid arm, which let the monitor leave the arm; the links are still posed rigid, so the range is narrowed to what the collar slide can reach." }
arm_base           = { value = [0.085, 0.1, 0.012, 0.07], unit = "m", class = "assumed", basis = "by_eye", tier = "cosmetic", evidence = "Desk-clamp base of the arm: plate length (fore-aft), width, thickness, and depth of the clamp jaw under the shelf. The post stands at the shelf's far edge, so an edge clamp is assumed; the base itself is hidden behind the soundbar." }
arm_elbow          = { value = [-0.048, 0.226, 0.03], unit = "m", class = "assumed", basis = "cross_instance", tier = "cosmetic", evidence = "Joint between the two links, from the collar on the post, rig axes. The links are hidden behind the monitor in every Rig B photo; pose chosen so that link lengths near the vendor figures (about 0.23 and 0.33) reach the monitor pivot, folded to the operator's left as on Rig C1 (IMG_2517)." }
arm_link_section   = { value = [0.05, 0.036], unit = "m", class = "assumed", basis = "cross_instance", tier = "cosmetic", evidence = "Width and height of the arm links, by eye from Rig C1 (IMG_2517)." }
arm_joint_radius   = { value = 0.03, unit = "m", class = "assumed", basis = "cross_instance", tier = "cosmetic", evidence = "Radius of the joint housings, by eye from Rig C1 (IMG_2517)." }
arm_head_length    = { value = 0.05, unit = "m", class = "assumed", basis = "cross_instance", tier = "cosmetic", evidence = "Wrist joint to the tilt pivot behind the monitor, by eye from Rig C1 (IMG_2517)." }
arm_ball_radius    = { value = 0.02, unit = "m", class = "invented", tier = "cosmetic", evidence = "The arm head is drawn as a ball on the monitor pivot, so tilt and pan turn the mounting plate round it without the two solids meeting; the real head is a tilt hinge with a pan pin (IMG_2517)." }
monitor_centre     = { value = [0.34, 0.0, 1.135], unit = "m", range = 0.04, class = "photo", tier = "critical", evidence = "Single view. Front-surface centre as photographed, IMG_2530/2532. Curved-panel fit to 4 corners (IMG_2530) and the bottom edge curve (IMG_2532): x 0.36 with size free, 0.315 with vendor size; z 1.13-1.14; y 0.00-0.02. Range applies to x (the rear-right photos cannot fix it); z and y are good to 0.02." }
monitor_tilt       = { value = 3.5, unit = "deg", range = 1.5, class = "photo", tier = "layout", evidence = "Single view. Top edge further from the operator than the bottom edge: 4.2 (size free), 3.1 (vendor size), 2.3 (IMG_2511)." }
monitor_tilt_range = { value = 15, unit = "deg", class = "assumed", basis = "standard_default", tier = "layout", evidence = "Typical tilt range of a desk arm head; assumed." }
monitor_pan_range  = { value = 30, unit = "deg", class = "assumed", basis = "standard_default", tier = "layout", evidence = "Typical pan range of a desk arm head; assumed." }
